name: CI/CD for Deployment to Heroku

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Lints the code
    runs-on: ubuntu-latest

    steps:
      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v3

  test:
    name: Run tests with Docker Compose
    runs-on: ubuntu-latest
    needs: lint

    env:
      ENVIRONMENT: ${{ vars.TEST_ENVIRONMENT }}
      PORT: ${{ vars.TEST_PORT }}
      DATABASE_PORT: ${{ vars.TEST_DATABASE_PORT }}
      DATABASE_HOST: ${{ vars.TEST_DATABASE_HOST }}
      HOST: ${{ vars.TEST_HOST }}
      DATABASE_NAME: ${{ vars.TEST_DATABASE_NAME }}
      DATABASE_USER: ${{ vars.TEST_DATABASE_USER }}
      DATABASE_PASSWORD: ${{ vars.TEST_DATABASE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Docker Compose tests
        run: |
          docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from test

  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Remove development-only files
        run: |
          rm -f docker-compose.yml docker-compose.test.yml .env .env.example
      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh 
      - uses: akhileshns/heroku-deploy@v3.14.15 # This is the action for deploying to Heroku
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: "classconnect13-ms-courses" # Must be unique in Heroku
          heroku_email: "afabregas@fi.uba.ar"
