services:
  postgres:
    image: "postgres"
    restart: "on-failure:3"
    hostname: "${DATABASE_HOST}"
    environment:
      POSTGRES_USER: "${DATABASE_USER}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
      POSTGRES_DB: "${DATABASE_NAME}"
    networks:
      ClassConnect:
    healthcheck:
      test: ["CMD-SHELL","su","postgres","psql"]
      interval: 2s
      retries: 5
      start_period: 2s      
      timeout: 2s

  test:
    image: test-docker
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      postgres:
        condition: service_healthy
    restart: "on-failure:3"
    environment:
      DB_USERNAME: "${DATABASE_USER}"
      DB_PASSWORD: "${DATABASE_PASSWORD}"
      DB_URL: "${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}"
      ENVIRONMENT: "development"
      DEV_USERS_URL: "${DEV_USERS_URL}"
      MS_USERS_URL: "${MS_USERS_URL}"
      TESTING: "true"
      NOTIF: "false"
    networks:
      ClassConnect:

networks:
  ClassConnect:
    name: ClassConnect-TEST-net
    driver: bridge
