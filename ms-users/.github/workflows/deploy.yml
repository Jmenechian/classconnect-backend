name: CI/CD for Deployment to Heroku

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Lints the code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.2

  #test:
    #name: Run tests with Docker Compose
    #runs-on: ubuntu-latest
    #needs: lint

    #steps:
      #- name: Checkout code
        #uses: actions/checkout@v3

      #- name: Run Docker Compose tests
        #run: |
          #docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from test

  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    #needs: test
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Remove development-only files
        run: |
          rm -f docker-compose.yml docker-compose.test.yml .env .env.example
      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh 
      - uses: akhileshns/heroku-deploy@v3.14.15 # This is the action for deploying to Heroku
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: "classconnect13-ms-users" # Must be unique in Heroku
          heroku_email: "afabregas@fi.uba.ar"
          usedocker: false
